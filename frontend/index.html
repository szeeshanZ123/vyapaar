<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Vyapar — Hyperlocal Street Vendor Intelligence</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth-client.js"></script>
  </head>
  <body class="bg-[#fcf8f6] text-[#1f1b17] min-h-screen flex flex-col items-center justify-center p-6 font-sans selection:bg-[#aa3000] selection:text-white">
    <div class="max-w-md w-full text-center bg-white p-8 sm:p-10 rounded-3xl shadow-sm border border-[#e8dfd8]">
      
      <!-- Brand Logo & Title -->
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-[#aa3000] text-white font-extrabold text-3xl shadow-md mb-6">
        V
      </div>

      <h1 class="text-3xl sm:text-4xl font-extrabold text-[#1f1b17] tracking-tight mb-3 font-['Plus_Jakarta_Sans',sans-serif]">
        Vyapar
      </h1>

      <p class="text-[#635d5c] text-base mb-8 leading-relaxed">
        Smart location intelligence and real-time demand forecasting for local street vendors.
      </p>

      <!-- Action Buttons -->
      <div class="flex flex-col gap-3.5">
        <a
          href="/login.html"
          class="w-full py-3.5 px-6 rounded-xl bg-[#aa3000] text-white font-bold text-base hover:bg-[#852400] transition-all shadow-md hover:shadow-lg active:scale-98 text-center"
        >
          Login
        </a>
        <a
          href="/signup.html"
          class="w-full py-3.5 px-6 rounded-xl bg-[#f6ece6] text-[#aa3000] font-bold text-base border border-[#e2bfb5] hover:bg-[#eae1da] transition-all active:scale-98 text-center"
        >
          Create Account
        </a>
      </div>

      <div class="mt-8 pt-6 border-t border-[#e8dfd8] text-xs text-[#8e7068]">
        <p>Hyperlocal intelligence for street vendors & consumers</p>
      </div>

    </div>

    <script>
      // If user is already authenticated, check profile and redirect accordingly
      document.addEventListener("DOMContentLoaded", async () => {
        if (window.VyaparAuth) {
          await window.VyaparAuth.redirectIfAuthenticated();
        }
      });
    </script>
  </body>
</html>
