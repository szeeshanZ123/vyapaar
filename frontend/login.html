<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Login — Vyapar</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth-client.js"></script>
  </head>
  <body class="bg-[#fcf8f6] text-[#1f1b17] min-h-screen flex flex-col items-center justify-center p-6 font-sans">
    <div class="max-w-md w-full bg-white p-8 sm:p-10 rounded-3xl shadow-sm border border-[#e8dfd8]">
      
      <!-- Header -->
      <div class="text-center mb-6">
        <a href="landing.html" class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-[#aa3000] text-white font-extrabold text-2xl shadow-sm mb-4">
          V
        </a>
        <h1 class="text-2xl sm:text-3xl font-bold text-[#1f1b17] font-['Plus_Jakarta_Sans',sans-serif]">
          Welcome back
        </h1>
        <p class="text-sm text-[#635d5c] mt-1">Sign in to your Vyapar account</p>
      </div>

      <!-- Alert Box -->
      <div id="error-alert" class="hidden mb-5 p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs font-medium"></div>

      <!-- Google OAuth Button -->
      <button
        type="button"
        id="google-login-btn"
        class="w-full py-3 px-4 rounded-xl border border-[#d0c5be] bg-white text-[#1f1b17] font-semibold text-sm hover:bg-[#faf5f2] transition-all flex items-center justify-center gap-3 shadow-sm active:scale-98"
      >
        <svg class="w-4 h-4" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.35 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.03 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.35 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        Continue with Google
      </button>

      <!-- Divider -->
      <div class="flex items-center my-6">
        <div class="flex-grow border-t border-[#e8dfd8]"></div>
        <span class="px-3 text-xs text-[#8e7068] uppercase font-semibold tracking-wider">or</span>
        <div class="flex-grow border-t border-[#e8dfd8]"></div>
      </div>

      <!-- Email / Password Form -->
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-[#1f1b17] uppercase tracking-wider mb-1.5" for="email">
            Email
          </label>
          <input
            id="email"
            type="email"
            required
            placeholder="you@example.com"
            class="w-full px-4 py-3 rounded-xl border border-[#d0c5be] bg-[#fff8f5] focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#aa3000] text-sm"
          />
        </div>

        <div>
          <label class="block text-xs font-bold text-[#1f1b17] uppercase tracking-wider mb-1.5" for="password">
            Password
          </label>
          <input
            id="password"
            type="password"
            required
            placeholder="••••••••"
            class="w-full px-4 py-3 rounded-xl border border-[#d0c5be] bg-[#fff8f5] focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#aa3000] text-sm"
          />
        </div>

        <button
          type="submit"
          id="submit-btn"
          class="w-full py-3.5 px-4 rounded-xl bg-[#aa3000] text-white font-bold text-sm hover:bg-[#852400] transition-all shadow-md active:scale-98"
        >
          Login
        </button>
      </form>

      <!-- Footer Link -->
      <p class="text-center text-xs text-[#635d5c] mt-6">
        Don't have an account?
        <a href="signup.html" class="font-bold text-[#aa3000] hover:underline ml-1">Create Account</a>
      </p>

    </div>

    <script>
      const auth = window.VyaparAuth;
      const errorAlert = document.getElementById("error-alert");
      const googleLoginBtn = document.getElementById("google-login-btn");
      const loginForm = document.getElementById("login-form");
      const submitBtn = document.getElementById("submit-btn");

      function showError(msg) {
        errorAlert.textContent = msg;
        errorAlert.classList.remove("hidden");
      }

      function clearError() {
        errorAlert.classList.add("hidden");
        errorAlert.textContent = "";
      }

      // Check if already logged in
      document.addEventListener("DOMContentLoaded", async () => {
        const session = await auth.getSession();
        if (session) {
          window.location.href = "auth-home.html";
        }
      });

      // Google OAuth login
      googleLoginBtn.addEventListener("click", async () => {
        clearError();
        try {
          await auth.loginWithGoogle();
        } catch (err) {
          showError(err.message || "Google sign-in failed.");
        }
      });

      // Email/Password login
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        clearError();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        submitBtn.disabled = true;
        submitBtn.textContent = "Signing in...";

        try {
          const res = await auth.loginWithEmail(email, password);
          if (res?.session) {
            // Check if profile exists in FastAPI
            try {
              const profileRes = await auth.callBackendAPI("/api/users/profile");
              if (profileRes?.data) {
                window.location.href = "auth-home.html";
                return;
              }
            } catch (pErr) {
              // If profile does not exist yet (404), go to role selection
              window.location.href = "role-selection.html";
              return;
            }
            window.location.href = "auth-home.html";
          }
        } catch (err) {
          showError(err.message || "Invalid email or password.");
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Login";
        }
      });
    </script>
  </body>
</html>
